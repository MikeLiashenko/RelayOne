# One-click deploy for RelayOne on Render (Blueprint).
#
# In Render: New + → Blueprint → pick the RelayOne repo → Apply.
# This creates BOTH a free Postgres database and the API web service, and wires
# them together automatically — no manual environment setup needed.
#
# After it's live:
#   1. Open your frontend once with the API URL:
#        https://<frontend>/login?api=https://<service>.onrender.com
#   2. (Optional, for file attachments) set STORAGE_PUBLIC_BASE_URL to
#        https://<service>.onrender.com/uploads
#
# Note: free tier sleeps when idle (first request ~30s). NODE_ENV=development
# shows the OTP code in the UI so you can sign in without an email/SMS provider
# (fine for a personal demo).

databases:
  - name: relayone-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: relayone-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: development
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: relayone-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://mikeliashenko.github.io
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
