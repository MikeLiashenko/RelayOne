# One-click deploy for RelayOne on Render (Blueprint).
#
# The Render web service is free indefinitely (sleeps when idle). Bring your own
# free Postgres (Neon is permanently free): create a Neon project, copy its
# connection string, and paste it when Render's Blueprint asks for DATABASE_URL.
#
# In Render: New + → Blueprint → pick the RelayOne repo → Apply →
#   paste DATABASE_URL (your Neon "postgresql://…?sslmode=require" string).
#
# After it's live:
#   1. Open your frontend once with the API URL:
#        https://<frontend>/login?api=https://<service>.onrender.com
#   2. (Optional, for file attachments) set STORAGE_PUBLIC_BASE_URL to
#        https://<service>.onrender.com/uploads
#
# NODE_ENV=development shows the OTP code in the UI so you can sign in without an
# email/SMS provider (fine for a personal demo).

services:
  - type: web
    name: relayone-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: development
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://mikeliashenko.github.io
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
