<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080B1A" />
  <title>RelayOne — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(1200px 600px at 50% -10%, #131a36 0%, #080b1a 60%);
      color: #eaf0ff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 8px 30px rgba(80, 90, 255, 0.35));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 4px 0 0; }
    p { margin: 0; color: #9aa6c8; font-size: 0.975rem; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 13px 28px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #168bff, #713bff);
      box-shadow: 0 8px 24px rgba(80, 90, 255, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(80, 90, 255, 0.55); }
    button:active { transform: translateY(0); }
    .hint { font-size: 0.85rem; color: #6b769a; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RelayOne">
      <defs>
        <linearGradient id="g" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#168BFF"/>
          <stop offset="1" stop-color="#713BFF"/>
        </linearGradient>
      </defs>
      <circle cx="256" cy="256" r="44" fill="url(#g)"/>
      <path d="M300 150 A150 150 0 0 1 384 256" fill="none" stroke="url(#g)" stroke-width="40" stroke-linecap="round"/>
      <path d="M212 362 A150 150 0 0 1 128 256" fill="none" stroke="url(#g)" stroke-width="40" stroke-linecap="round"/>
      <circle cx="384" cy="256" r="22" fill="#713BFF"/>
      <circle cx="128" cy="256" r="22" fill="#168BFF"/>
    </svg>
    <h1>You're offline</h1>
    <p>RelayOne can't reach the internet right now. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <span class="hint">We'll reconnect automatically once you're back online.</span>
  </div>
  <script>
    // Auto-retry the moment the connection returns.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
