<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RelayOne symbol">
  <defs>
    <linearGradient id="r1-grad" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#713BFF"/>
    </linearGradient>
  </defs>

  <!-- Two nodes in orbit around a central hub: relay + "one place". -->
  <g fill="none" stroke="url(#r1-grad)" stroke-width="34" stroke-linecap="round">
    <path d="M256 128 A128 128 0 0 1 384 256"/>
    <path d="M256 384 A128 128 0 0 1 128 256"/>
  </g>
  <circle cx="384" cy="256" r="23" fill="#713BFF"/>
  <circle cx="128" cy="256" r="23" fill="#168BFF"/>
  <circle cx="256" cy="256" r="50" fill="url(#r1-grad)"/>
</svg>
